name: GSC Indexation Check

on:
  schedule:
    # Mondays 10:00 UTC, deliberately an hour after the blog auto-publish
    # (09:00) so a freshly generated article is included in the inspection.
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Read-only on purpose: this job never writes back to the repo, so it
    # must not request contents: write and never pushes a report commit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check GSC indexation
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-check.mjs --out gsc-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-report
          path: gsc-report.json
          retention-days: 30
          if-no-files-found: warn
