name: GSC Indexing Reminder

# Runs every 15 minutes on purpose. The reminder itself is still sent at
# most once per morning - scripts/pick-url.js gates the send on
# state/gsc-queue.json -> lastSentDate plus a morning hour window - but
# button presses are now answered within minutes instead of on the next
# morning. GitHub routinely delays a scheduled run by 5-10 minutes, so a
# press can take up to ~25 minutes to be acknowledged; that is the reason
# for the short interval.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A wake-up takes a few seconds, so overlapping runs should not happen -
# but two runs writing state/gsc-queue.json at the same time would let one
# overwrite the other's button handling. Serialise instead of racing.
concurrency:
  group: gsc-index-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pick-url script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/pick-url.js
      - name: Persist queue state (with retry + rebase on conflict)
        run: |
          git config --global user.name 'LocalJSON Bot'
          git config --global user.email 'bot@localjson.dev'
          
          for attempt in 1 2 3; do
            git add state/gsc-queue.json
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "bot: update GSC indexing queue"
            
            # Try push with rebase on conflict
            if git pull --rebase origin main && git push; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            else
              echo "Push failed (attempt $attempt), retrying..."
              sleep 5
            fi
          done
          
          echo "All push attempts failed"
          exit 1