name: Daily GSC Indexing Reminder

on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 MSK (UTC+3) = 07:00 UTC
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run pick-url script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/pick-url.js
      - name: Persist queue state
        run: |
          git config --global user.name 'LocalJSON Bot'
          git config --global user.email 'bot@localjson.dev'
          git add state/gsc-queue.json
          git commit -m "bot: update GSC indexing queue" || echo "No changes"
          git push