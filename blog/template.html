<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    <title>{{TITLE}} | LocalJSON Blog</title>
    <link rel="canonical" href="{{CANONICAL}}">
    <link rel="alternate" hreflang="en" href="{{CANONICAL}}">
    <link rel="alternate" hreflang="es" href="https://localjson-black.vercel.app/es/blog/{{SLUG}}/" />
    <link rel="alternate" hreflang="x-default" href="{{CANONICAL}}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="https://localjson-black.vercel.app/1.jpg">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{CANONICAL}}">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="https://localjson-black.vercel.app/1.jpg">

    <!-- JSON-LD Article -->
    <script type="application/ld+json">
{{JSONLD}}
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a;
            --bg-elevated: #1e293b;
            --fg: #f1f5f9;
            --fg-muted: #94a3b8;
            --accent: #22d3ee;
            --accent-hover: #06b6d4;
            --amber: #fbbf24;
            --amber-hover: #f59e0b;
            --border: #334155;
            --card: #1e293b;
            --code-bg: #0f172a;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        header { background: var(--bg-elevated); border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.25rem; color: var(--fg); }
        .logo svg { width: 32px; height: 32px; color: var(--accent); }
        .lang-switch { display: flex; gap: 0.5rem; }
        .lang-btn { background: transparent; border: 1px solid var(--border); color: var(--fg-muted); padding: 0.375rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; }
        .lang-btn:hover { border-color: var(--accent); color: var(--accent); }
        .lang-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem; }
        .breadcrumbs { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--fg-muted); margin-bottom: 1.5rem; }
        .breadcrumbs a { color: var(--fg-muted); }
        .breadcrumbs a:hover { color: var(--accent); }
        .breadcrumbs span { color: var(--border); }
        .back-link { display: inline-flex; align-items: center; gap: 0.375rem; color: var(--accent); font-size: 0.875rem; margin-bottom: 1.5rem; }
        .back-link:hover { color: var(--accent-hover); }
        article { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; }
        article h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; color: var(--fg); line-height: 1.3; }
        .article-meta { display: flex; align-items: center; gap: 1.5rem; font-size: 0.875rem; color: var(--fg-muted); margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .article-meta time { white-space: nowrap; }
        .article-meta .cluster { background: var(--bg); padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; border: 1px solid var(--border); }
        .article-body { font-size: 1.0625rem; line-height: 1.8; }
        .article-body h2 { font-size: 1.5rem; font-weight: 600; margin: 2.5rem 0 1rem; color: var(--fg); }
        .article-body h3 { font-size: 1.25rem; font-weight: 600; margin: 2rem 0 0.75rem; color: var(--fg); }
        .article-body p { margin-bottom: 1.25rem; }
        .article-body ul, .article-body ol { margin: 1rem 0 1rem 1.5rem; }
        .article-body li { margin-bottom: 0.5rem; }
        .article-body code { background: var(--code-bg); padding: 0.125rem 0.375rem; border-radius: 4px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9em; color: var(--accent); }
        .article-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; overflow-x: auto; margin: 1.5rem 0; }
        .article-body pre code { background: none; padding: 0; color: var(--fg); font-size: 0.875rem; line-height: 1.7; }
        .article-body strong { font-weight: 600; }
        .article-body em { font-style: italic; }
        .article-body blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 1.5rem 0; color: var(--fg-muted); font-style: italic; }
        .article-body img { max-width: 100%; border-radius: 8px; margin: 1.5rem 0; }
        .article-body a { border-bottom: 1px solid transparent; transition: border-color 0.2s; }
        .article-body a:hover { border-color: var(--accent); }
        footer { background: var(--bg-elevated); border-top: 1px solid var(--border); padding: 2rem; margin-top: auto; }
        .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; }
        .footer-links { display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .footer-links a { color: var(--fg-muted); font-size: 0.875rem; }
        .footer-links a:hover { color: var(--accent); }
        .copyright { color: var(--fg-muted); font-size: 0.875rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo" aria-label="LocalJSON — Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    <rect x="8" y="8" width="8" height="8" rx="1"></rect>
                </svg>
                LocalJSON
            </a>
            <div class="lang-switch">
                <button class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
                <button class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
            </div>
        </div>
    </header>

    <main>
        <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="/">Home</a>
            <span>/</span>
            <a href="/blog/">Blog</a>
            <span>/</span>
            <span aria-current="page">{{TITLE}}</span>
        </nav>

        <a href="/blog/" class="back-link">← Back to all posts</a>

        <article>
            <header>
                <h1>{{TITLE}}</h1>
                <div class="article-meta">
                    <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time>
                    <span class="cluster">{{CLUSTER}}</span>
                </div>
            </header>
            <div class="article-body">
{{BODY}}
            </div>
        </article>

        <a href="/blog/" class="back-link" style="margin-top: 2rem; display: inline-flex;">← Back to all posts</a>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-links">
                <a href="/">Tool</a>
                <a href="/blog/">Blog</a>
            </div>
            <div class="copyright">© 2026 LocalJSON. All rights reserved.</div>
        </div>
    </footer>

    <script>
        // Language switcher (static blog pages - no I18N dict, just navigation)
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                const currentPath = window.location.pathname;
                let newPath;
                if (lang === 'es') {
                    newPath = currentPath.replace('/blog/', '/es/blog/');
                } else {
                    newPath = currentPath.replace('/es/blog/', '/blog/');
                }
                window.location.href = newPath;
            });
        });
    </script>
</body>
</html>
